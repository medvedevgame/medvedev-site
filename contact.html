                  1. Sign up at https://formspree.io (free)
                  2. Create a form and connect your email (pogladilgolubya@gmail.com)
                  3. Replace YOUR_FORM_ID below with the ID from Formspree
                -->
                <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-field">
                        <label for="email">Your email</label>
                        <input type="email" id="email" name="_replyto" required placeholder="you@example.com">
                    </div>
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Hi!"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send</button>
                </form>
            </div>
