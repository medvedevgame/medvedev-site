<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Medvedev</title>
    <meta name="description" content="Связаться с Medvedev: соцсети и форма для письма напрямую на почту.">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <a href="index.html" class="sidebar-name">MEDVEDEV</a>
        <div class="sidebar-tag">devlog &amp; portfolio</div>

        <ul class="sidebar-nav">
            <li><a href="index.html"><span class="arrow">↗</span>Home</a></li>
            <li><a href="portfolio.html"><span class="arrow">↗</span>Portfolio</a></li>
            <li><a href="blog.html"><span class="arrow">↗</span>Blog</a></li>
            <li><a href="contact.html" class="is-active"><span class="arrow">↗</span>Contact</a></li>
            <li><a href="https://simorgh.space" target="_blank" rel="noopener noreferrer"><span class="arrow">↗</span>Radio</a></li>
        </ul>

        <!-- Замените на свои реальные почту и телеграм -->
        <div class="sidebar-contact">
            <a href="mailto:you@example.com">YOU@EXAMPLE.COM</a>
            <a href="https://t.me/YOUR_TELEGRAM" target="_blank" rel="noopener noreferrer">@YOUR_TELEGRAM</a>
        </div>
    </aside>

    <main class="content-pane">
        <div class="section-label">Contact</div>
        <h1 class="page-title">Написать мне</h1>
        <p class="lede" style="margin-bottom: 8px;">
            Пишите по любым вопросам — предложения, отзывы о демках, просто
            поздороваться.
        </p>

        <div class="contact-grid">
            <div>
                <div class="section-label" style="margin-bottom: 14px;">Соцсети</div>
                <div class="social-stack">
                    <!-- Замените href на свои ссылки, при необходимости добавьте/удалите строки -->
                    <a class="social-btn" href="https://t.me/YOUR_TELEGRAM" target="_blank" rel="noopener noreferrer">
                        Telegram <span class="arrow">↗</span>
                    </a>
                    <a class="social-btn" href="https://github.com/YOUR_GITHUB" target="_blank" rel="noopener noreferrer">
                        GitHub <span class="arrow">↗</span>
                    </a>
                    <a class="social-btn" href="https://YOURNAME.itch.io" target="_blank" rel="noopener noreferrer">
                        itch.io <span class="arrow">↗</span>
                    </a>
                </div>
            </div>

            <div>
                <div class="section-label" style="margin-bottom: 14px;">Письмо на почту</div>
                <!--
                  Форма отправляет письмо на вашу почту через Formspree.
                  1. Зарегистрируйтесь на https://formspree.io (бесплатно)
                  2. Создайте форму, привяжите свою почту
                  3. Замените YOUR_FORM_ID ниже на ID из Formspree
                -->
                <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-field">
                        <label for="email">Ваша почта</label>
                        <input type="email" id="email" name="_replyto" required placeholder="you@example.com">
                    </div>
                    <div class="form-field">
                        <label for="message">Сообщение</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Привет!"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Отправить</button>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
